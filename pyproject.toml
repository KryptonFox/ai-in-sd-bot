[project]
name = "itmo-tg-template"
version = "0.1.0"
description = "Учебный Telegram-бот: текстовое эхо и подключение PostgreSQL"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram==3.31.0",
    "aiohttp>=3.14.3,<4",
    "aiohttp-socks==0.12.0",
    "asyncpg==0.31.0",
    "httpx>=0.28,<0.29",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "tzdata>=2026.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: tests requiring Docker and PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.6",
]
