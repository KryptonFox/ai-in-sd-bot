services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bot}
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    profiles: ["cloud"]
    build: .
    image: itmo-ai-bot:local
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Задайте BOT_TOKEN}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-bot}
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HEALTH_PORT: ${HEALTH_PORT:-8080}
      MCP_TRANSPORT: streamable-http
      MCP_SERVER_URL: http://student-tools-mcp:8000/mcp
      MCP_SHARED_SECRET: ${MCP_SHARED_SECRET:-}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 10s
      timeout: 20s
      retries: 6
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - mcp_internal

  student-tools-mcp:
    profiles: ["cloud"]
    build: .
    image: itmo-ai-bot:local
    command: ["python", "-m", "mcp_servers.student_tools", "--transport", "streamable-http"]
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-bot}
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}
      MCP_SHARED_SECRET: ${MCP_SHARED_SECRET:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      SCHEDULE_PATH: mcp_servers/student_tools/data/schedule.json
      SCHEDULE_TIMEZONE: ${SCHEDULE_TIMEZONE:-Europe/Moscow}
    volumes:
      - type: bind
        source: ${SCHEDULE_PATH:-./mcp_servers/student_tools/data/schedule.json}
        target: /app/mcp_servers/student_tools/data/schedule.json
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - mcp_internal
    healthcheck:
      test: ["CMD", "python", "-m", "mcp_servers.student_tools.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:

networks:
  mcp_internal:
    internal: true
